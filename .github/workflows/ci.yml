name: deterministic-ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  policy:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.lock .
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q -m 'not integration'
  durability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_DB_URL: postgresql://orchestrator:local-orchestrator-demo@127.0.0.1:15433/orchestrator
      ORCH_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock .
      - run: docker compose up -d postgres temporal
      - name: Wait for services
        run: python scripts/wait_services.py
      - run: python -m pytest -q -p no:cacheprovider --junitxml=.orchestrator/tests.xml
      - run: docker compose build worker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: durability-evidence
          path: .orchestrator/
          include-hidden-files: true
          retention-days: 14
      - run: docker compose down
        if: always()
