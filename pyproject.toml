[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-workflow-orchestrator"
version = "0.1.0"
description = "Durable Temporal workflows with PostgreSQL side-effect verification"
requires-python = ">=3.11"
dependencies = ["temporalio>=1.15,<2", "psycopg[binary]>=3.2,<4", "pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
orchestrator = "workflow_orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires local Temporal and PostgreSQL"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
